<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bem-Estar">
  <title>Bem-Estar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">✦</div>
        <div>
          <h1 class="header-title">Bem-Estar</h1>
          <p class="header-date" id="data-hoje"></p>
        </div>
      </div>
      <div class="save-badge" id="save-status"></div>
    </header>

    <!-- SCORE BAR -->
    <div class="score-bar">
      <div class="score-item">
        <span class="score-num" id="s-hab">0/0</span>
        <span class="score-lbl">hábitos</span>
      </div>
      <div class="score-sep"></div>
      <div class="score-item">
        <span class="score-num" id="s-humor">—</span>
        <span class="score-lbl">humor</span>
      </div>
      <div class="score-sep"></div>
      <div class="score-item">
        <span class="score-num" id="s-energia">—</span>
        <span class="score-lbl">energia</span>
      </div>
      <div class="score-sep"></div>
      <div class="score-item">
        <span class="score-num" id="s-sono">—h</span>
        <span class="score-lbl">sono</span>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- HÁBITOS -->
      <section class="card">
        <div class="card-header">
          <h2 class="card-title">Hábitos do dia</h2>
          <span class="card-badge" id="hab-badge">0/5</span>
        </div>
        <div class="habits-grid" id="habits-grid">
          <!-- gerado pelo JS -->
        </div>
      </section>

      <!-- MOOD + ENERGIA -->
      <div class="two-col">

        <section class="card">
          <h2 class="card-title">Humor</h2>
          <div class="emoji-picker" id="humor-picker">
            <button class="emoji-btn" data-val="1" title="Muito mau">😞</button>
            <button class="emoji-btn" data-val="2" title="Mau">😐</button>
            <button class="emoji-btn" data-val="3" title="OK">🙂</button>
            <button class="emoji-btn" data-val="4" title="Bom">😊</button>
            <button class="emoji-btn" data-val="5" title="Ótimo">😄</button>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">Energia</h2>
          <div class="emoji-picker" id="energia-picker">
            <button class="emoji-btn" data-val="1" title="Esgotado">🪫</button>
            <button class="emoji-btn" data-val="2" title="Cansado">😴</button>
            <button class="emoji-btn" data-val="3" title="Normal">⚡</button>
            <button class="emoji-btn" data-val="4" title="Ativo">🔥</button>
            <button class="emoji-btn" data-val="5" title="Máximo">🚀</button>
          </div>
        </section>

      </div>

      <!-- SONO -->
      <section class="card">
        <div class="card-header">
          <h2 class="card-title">Sono</h2>
          <span class="sono-val" id="sono-display">7h</span>
        </div>
        <div class="slider-wrap">
          <span class="slider-label">4h</span>
          <input type="range" id="sono-slider" min="4" max="12" step="0.5" value="7" class="slider">
          <span class="slider-label">12h</span>
        </div>
        <div class="sono-bar-wrap">
          <div class="sono-bar" id="sono-bar" style="width: 50%"></div>
        </div>
      </section>

      <!-- NOTAS -->
      <section class="card">
        <h2 class="card-title">Notas do dia</h2>
        <textarea id="notas" class="notas-input" placeholder="Como foi o teu dia? O que queres lembrar?"></textarea>
      </section>

      <!-- BOTÃO GUARDAR -->
      <button class="btn-guardar" id="btn-guardar" onclick="guardarDia()">
        <span>Guardar o dia</span>
        <span class="btn-icon">→</span>
      </button>

    </main>

    <!-- HISTÓRICO (tab) -->
    <div class="tab-bar">
      <button class="tab active" onclick="mudarTab('hoje')">Hoje</button>
      <button class="tab" onclick="mudarTab('historico')">Histórico</button>
    </div>

    <div id="painel-historico" class="historico-panel hidden">
      <div id="historico-lista" class="historico-lista">
        <p class="historico-empty">A carregar...</p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
